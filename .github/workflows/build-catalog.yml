name: Build catalog

on:
  push:
    branches: [main]
    paths:
      - 'capabilities/**'
      - 'catalog.json'
      - 'scripts/regenerate_catalog.py'

jobs:
  catalog:
    name: Regenerate and sign catalog.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild and sign catalog
        env:
          MODDIN_SIGNING_KEY: ${{ secrets.MODDIN_CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          python scripts/regenerate_catalog.py

      - name: Commit regenerated catalog
        run: |
          set -euo pipefail
          git config user.name "moddin-bot"
          git config user.email "bot@petonexus"
          git add catalog.json catalog.json.sig || true
          if git diff --staged --quiet; then
            echo "catalog unchanged"
          else
            git commit -m "chore(catalog): regenerate catalog.json"
            git push
          fi

      - name: Attach catalog to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python -c "import json,datetime; c=json.load(open('catalog.json')); print('v'+datetime.datetime.utcnow().strftime('%Y%m%d.%H%M%S'))")
          gh release create "$version" \
            --title "Catalog $version" \
            --notes "Auto-generated by build-catalog workflow." \
            --target main \
            catalog.json catalog.json.sig || true
