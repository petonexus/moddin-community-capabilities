name: Build catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capabilities/**'
      - 'public-keys.json'
      - '.github/workflows/build-catalog.yml'
      - 'scripts/regenerate_catalog.py'
      # regenerate_catalog.py inlines revoked-ids.json into catalog.json
      # before signing. Without this path a push that only adds a
      # revocation rebuilds nothing, so the signature keeps covering a
      # catalogue that no longer lists it and the revocation is
      # accepted by the repo and ignored by the app.
      - 'revoked-ids.json'

jobs:
  catalog:
    name: Regenerate and sign catalog.json
    runs-on: ubuntu-latest
    # The repository's default workflow token is read-only. The commit
    # step pushes the regenerated catalog and the release step creates a
    # release; both need contents: write, and without it they fail with a
    # 403 only after signing has already succeeded.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild and sign catalog
        env:
          MODDIN_SIGNING_KEY: ${{ secrets.MODDIN_CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$MODDIN_SIGNING_KEY" || { echo "Missing catalog signing key"; exit 1; }
          python scripts/test_regenerate_catalog.py
          python scripts/regenerate_catalog.py

      - name: Commit regenerated catalog
        run: |
          set -euo pipefail
          git config user.name "moddin-bot"
          git config user.email "bot@petonexus"
          git add catalog.json catalog.json.sig
          if git diff --staged --quiet; then
            echo "catalog unchanged"
          else
            git commit -m "chore(catalog): regenerate catalog.json"
            git push
          fi

      - name: Attach catalog to release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python -c "import json,datetime; c=json.load(open('catalog.json')); print('v'+datetime.datetime.utcnow().strftime('%Y%m%d.%H%M%S'))")
          gh release create "$version" \
            --title "Catalog $version" \
            --notes "Auto-generated by build-catalog workflow." \
            --target main \
            catalog.json catalog.json.sig
